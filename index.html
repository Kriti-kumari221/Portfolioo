    <!-- Apply saved theme before first paint to avoid a light/dark flash -->
    <script>
      try {
        if (localStorage.getItem("portfolio-theme") === "quantum") {
          document.documentElement.setAttribute("data-theme", "quantum");
        }
      } catch (e) {}
